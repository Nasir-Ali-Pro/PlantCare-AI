name: plantcare_app
description: "PlantCare AI — Premium Plant Disease Classifier and Diagnostics App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  provider: ^6.1.2

  # Cloud AI (Gemini)
  google_generative_ai: ^0.4.7

  # Cloud Database & Caching
  supabase_flutter: ^2.12.4

  # Image handling
  image_picker: ^1.1.2
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1
  uuid: ^4.5.1

  # Premium UI & Aesthetics
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # System Utilities
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  mime: ^1.0.6
  url_launcher: ^6.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  encrypt: ^5.0.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  connectivity_plus: ^6.1.0
  in_app_review: ^2.0.10

  # Database Persistence (CIA Triad Encrypted storage)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/data/treatment_data.json
